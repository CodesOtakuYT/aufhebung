[package]
name = "aufhebung"
version.workspace = true
edition.workspace = true
description = "Zero-copy cursor operations on slices, accelerated with memchr for bytes"
keywords = ["slice", "cursor", "parser", "take", "scanning"]
autobenches = false

# Keep the lib's unit-test harness out of `cargo bench` so criterion CLI flags
# (--save-baseline, --quick, ...) are not forwarded to libtest, which rejects
# them (see bheisler/criterion.rs#193). Tests still run under `cargo test`.
[lib]
bench = false

[dependencies]
aufhebung-core.workspace = true
aufhebung-http.workspace = true

[dev-dependencies]
atoi = "3"
bstr = "1"
btoi = "0.5"
criterion = "0.5"
httparse = "1"
memchr.workspace = true

[[bench]]
name = "http"
harness = false

[[bench]]
name = "http_chunked"
harness = false

[[bench]]
name = "int"
harness = false

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "fragmentation"
harness = false

[workspace]
members = ["crates/aufhebung-core", "crates/aufhebung-http"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aufhebung-core = { path = "crates/aufhebung-core", version = "0.1.0" }
aufhebung-http = { path = "crates/aufhebung-http", version = "0.1.0" }
memchr = "2"